<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="700" rx="10" fill="#ffffff"/>

  <text x="28" y="40" font-size="17" font-weight="700" fill="#1f2328">Fluxo agentic-workflows — do projeto ao merge</text>
  <text x="28" y="62" font-size="12.5" fill="#57606a">azul = skill deste repo · verde = sempre humano · * opus quando disponível, senão sonnet + xhigh</text>

  <!-- 1 -->
  <g>
    <rect x="28" y="84" width="360" height="56" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="48" y="107" font-size="13.5" font-weight="600" fill="#1f2328">1 · Pensar o projeto</text>
    <text x="48" y="126" font-size="11.5" fill="#57606a">contexto, stack, regras de review</text>
  </g>
  <text x="410" y="107" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0969da">/init</text>
  <text x="410" y="126" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0969da">/project-skill-bootstrap</text>
  <line x1="64" y1="140" x2="64" y2="162" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 2 -->
  <g>
    <rect x="28" y="162" width="360" height="56" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="48" y="185" font-size="13.5" font-weight="600" fill="#1f2328">2 · Criar o plano</text>
    <text x="48" y="204" font-size="11.5" fill="#57606a">docs/PLANO.md em fases · architect (opus*)</text>
  </g>
  <text x="410" y="185" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0969da">/plan-create "&lt;objetivo&gt;"</text>
  <text x="410" y="204" font-size="11.5" fill="#57606a">lê o repo antes de propor fases</text>
  <line x1="64" y1="218" x2="64" y2="240" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 3 -->
  <g>
    <rect x="28" y="240" width="360" height="56" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="48" y="263" font-size="13.5" font-weight="600" fill="#1f2328">3 · Revisar as fases</text>
    <text x="48" y="282" font-size="11.5" fill="#57606a">escopo, critério de pronto, dependências</text>
  </g>
  <text x="410" y="263" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0969da">/plan-create --dry-run</text>
  <text x="410" y="282" font-size="11.5" fill="#57606a">nada é gravado sem aprovação</text>
  <line x1="64" y1="296" x2="64" y2="318" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 4 -->
  <g>
    <rect x="28" y="318" width="360" height="56" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="48" y="341" font-size="13.5" font-weight="600" fill="#1f2328">4 · Classificar fase → modelo + effort</text>
    <text x="48" y="360" font-size="11.5" fill="#57606a">phase-planner quebra em tarefas e pontua</text>
  </g>
  <text x="410" y="341" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0969da">/run-phase 3 --dry-run</text>
  <text x="410" y="360" font-size="11.5" fill="#57606a">volume → modelo · raciocínio → effort</text>
  <line x1="64" y1="374" x2="64" y2="396" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 5 -->
  <g>
    <rect x="28" y="396" width="360" height="56" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="48" y="419" font-size="13.5" font-weight="600" fill="#1f2328">5 · Rodar a fase</text>
    <text x="48" y="438" font-size="11.5" fill="#57606a">lotes paralelos, 1 worktree por tarefa</text>
  </g>
  <text x="410" y="419" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0969da">/run-phase 3</text>
  <text x="410" y="438" font-size="11.5" fill="#57606a">implementer-fast / implementer / architect</text>
  <line x1="64" y1="452" x2="64" y2="474" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 6 -->
  <g>
    <rect x="28" y="474" width="360" height="56" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="48" y="497" font-size="13.5" font-weight="600" fill="#1f2328">6 · Abrir PR</text>
    <text x="48" y="516" font-size="11.5" fill="#57606a">1 tarefa = 1 branch = 1 PR</text>
  </g>
  <text x="410" y="497" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0969da">/pr-create</text>
  <text x="410" y="516" font-size="11.5" fill="#57606a">já chamado pelo /run-phase</text>
  <line x1="64" y1="530" x2="64" y2="552" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 7 -->
  <g>
    <rect x="28" y="552" width="360" height="56" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="48" y="575" font-size="13.5" font-weight="600" fill="#1f2328">7 · Revisar PR</text>
    <text x="48" y="594" font-size="11.5" fill="#57606a">padrões do projeto + bugs de correção</text>
  </g>
  <text x="410" y="575" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0969da">/pr-review 123</text>
  <text x="410" y="594" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0969da">/code-review high --comment</text>
  <line x1="64" y1="608" x2="64" y2="630" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- 8 -->
  <g>
    <rect x="28" y="630" width="360" height="56" rx="6" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="48" y="653" font-size="13.5" font-weight="600" fill="#1f2328">8 · Merge</text>
    <text x="48" y="672" font-size="11.5" fill="#57606a">e marcar a fase concluída no plano</text>
  </g>
  <text x="410" y="653" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57606a">gh pr merge</text>
  <text x="410" y="672" font-size="11.5" fill="#1a7f37">o merge é sempre humano</text>

  <!-- loop -->
  <path d="M 388 658 C 780 658 790 346 790 346 C 790 346 600 346 390 346" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arw)"/>
  <text x="716" y="505" font-size="11.5" fill="#57606a" transform="rotate(-90 716 505)">próxima fase</text>
</svg>
